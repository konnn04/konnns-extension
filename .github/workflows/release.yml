name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Decide version bump
        id: bump
        run: |
          MSG=$(git log -1 --pretty=%B)
          if echo "$MSG" | grep -qiE 'breaking change|#major'; then LEVEL=major
          elif echo "$MSG" | grep -qiE '(^|\n)feat(\(|:| )|#minor'; then LEVEL=minor
          else LEVEL=patch; fi
          echo "level=$LEVEL" >> "$GITHUB_OUTPUT"
          echo "Bump level: $LEVEL"

      - name: Bump version (package.json -> manifest via WXT)
        run: pnpm version ${{ steps.bump.outputs.level }} --no-git-tag-version

      - name: Read new version
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: notes
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          NEW_VERSION: ${{ steps.ver.outputs.version }}
        run: node .github/scripts/ai-changelog.mjs > RELEASE_NOTES.md

      - name: Build zips
        run: |
          pnpm build && pnpm zip
          pnpm build:firefox && pnpm exec wxt zip -b firefox

      - name: Commit & tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): v${{ steps.ver.outputs.version }} [skip ci]"
          git tag "v${{ steps.ver.outputs.version }}"
          git push origin HEAD:main --follow-tags

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: .output/*.zip
          make_latest: "true"
